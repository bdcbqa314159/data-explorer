[package]
name = "datawire-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["fs"] }
datawire-shared = { path = "../shared" }
